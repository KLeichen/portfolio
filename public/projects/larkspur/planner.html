<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Larkspur Bake Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* A bakery's morning sheet: warm paper, crust browns, a butter accent for the plan being decided. */
:root {
  --bg: #f6efe3; --surface: #fffaf2; --ink: #2b1d12; --ink-2: #6b5544; --ink-3: #9a8572; --line: #e7d9c4;
  --crust: #9c5b2b;       /* expected sold */
  --crumb: #ecd3ac;       /* expected leftovers */
  --butter: #d99a2b;      /* the plan / selection */
  --band: #f3e4cb;        /* event days */
  --good: #3f7a3a; --bad: #a8432f;
  --display: "Fraunces", Georgia, serif; --body: "Work Sans", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1510; --surface: #261d16; --ink: #f3e8d8; --ink-2: #c4ae96; --ink-3: #8f7a66; --line: #3a2d22;
    --crust: #d08a52; --crumb: #5e4630; --butter: #e9b14c; --band: #2f241b; --good: #8fc58a; --bad: #e08a74;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.45; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 22px 22px 18px; }
.kicker { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
h1 { font-family: var(--display); font-size: 30px; margin: 4px 0 2px; letter-spacing: -.01em; }
.sub { color: var(--ink-2); margin: 0 0 14px; max-width: 62em; }
.filters { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-bottom: 14px; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; color: var(--ink-2); font: 500 13px var(--body); padding: 6px 14px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
select { font: 500 13px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; }
.grid { display: grid; grid-template-columns: 1fr 300px; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.card h2 { font-family: var(--display); font-size: 17px; margin: 0 0 2px; }
.card .note { color: var(--ink-3); font-size: 12px; margin: 0 0 8px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-top: 6px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; }
.legend i.fc { height: 3px; border-radius: 2px; vertical-align: 3px; background: var(--ink); }
svg text { font-family: var(--body); }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.kpi b { display: block; font-family: var(--display); font-size: 22px; }
.kpi span { color: var(--ink-2); font-size: 12px; }
.kpi.hl { border-color: var(--butter); box-shadow: inset 0 0 0 1px var(--butter); }
.delta { font-family: var(--mono); font-size: 11px; }
.delta.up { color: var(--good); } .delta.down { color: var(--bad); }
input[type=range] { width: 100%; accent-color: var(--butter); }
.slider-head { display: flex; justify-content: space-between; align-items: baseline; }
.slider-head b { font-family: var(--mono); font-size: 13px; }
.reset { border: 1px solid var(--line); background: transparent; color: var(--ink-2); border-radius: 999px; font: 500 12px var(--body); padding: 3px 10px; cursor: pointer; }
#tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 9px 11px; font-size: 12px; line-height: 1.5; opacity: 0; transition: opacity .1s; z-index: 5; min-width: 170px; }
#tip b { font-family: var(--display); font-size: 14px; display: block; margin-bottom: 2px; }
#tip .r { display: flex; justify-content: space-between; gap: 14px; }
.foot { color: var(--ink-3); font-size: 11.5px; margin-top: 10px; }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr; } h1 { font-size: 24px; } }
</style>
</head>

<div class="wrap">
  <div class="kicker" id="kicker"></div>

    <div class="seg" id="shops" role="group"></div>
    <select id="product" aria-label="product"></select>
  </div>

      <div class="legend" id="legend"></div>
    </div>
    <div>
      <div class="kpis" id="kpis"></div>
      <div class="card">

        <input type="range" id="adj" min="-30" max="30" step="1" value="0">
        <svg id="curve" width="100%" viewBox="0 0 268 120"></svg>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px">
          <span class="note" id="curveNote" style="margin:0"></span>
          <button class="reset" id="reset"></button>
        </div>
      </div>
    </div>
  </div>
  <p class="foot" id="foot"></p>
</div>
<div id="tip"></div>

    el("rect", { x, y: y(p.sold), width: w, height: Math.max(0, y(0) - y(p.sold)), fill: "var(--crust)", rx: 3 }, svg);
    const dt = new Date("2026-" + p.d + "T12:00:00");
    el("text", { x: x + w / 2, y: H - B + 16, "font-size": 11, fill: "var(--ink-2)", "text-anchor": "middle" }, svg).textContent = T.dow[dt.getDay()];
    el("text", { x: x + w / 2, y: H - B + 30, "font-size": 10.5, fill: "var(--ink-3)", "text-anchor": "middle" }, svg).textContent = dt.getDate();
  });
  // forecast line
  const pts = per.map((p, i) => `${L + i * bw + bw / 2},${y(p.mu)}`).join(" ");
  el("polyline", { points: pts, fill: "none", stroke: "var(--ink)", "stroke-width": 2, "stroke-linejoin": "round" }, svg);
  per.forEach((p, i) => el("circle", { cx: L + i * bw + bw / 2, cy: y(p.mu), r: 3.5, fill: "var(--ink)", stroke: "var(--surface)", "stroke-width": 2 }, svg));
  // hover targets
  per.forEach((p, i) => {
    const hit = el("rect", { x: L + i * bw, y: Tp, width: bw, height: H - Tp - B + 34, fill: "transparent" }, svg);
    const dt = new Date("2026-" + p.d + "T12:00:00");
    const ev = [p.promo ? T.tip.ev[0] : "", p.fest ? T.tip.ev[1] : ""].filter(Boolean).join(" · ");
    const nShops = rs.filter((r) => r.d === p.d).length;
    hit.onmousemove = (e) => showTip(e, `<b>${T.dow[dt.getDay()]} ${dt.getDate()}/10</b>${ev ? `<div style="opacity:.75">${ev}</div>` : ""}
      <div class="r"><span>${T.tip.fc}</span><span>${nf.format(p.mu)}</span></div>
      <div class="r"><span>${T.tip.bake}</span><span>${nf.format(p.q)}</span></div>
      <div class="r"><span>${T.tip.sold}</span><span>${nf.format(p.sold)}</span></div>
      <div class="r"><span>${T.tip.left}</span><span>${nf.format(p.left)}</span></div>
      ${nShops === 1 ? `<div class="r"><span>${T.tip.so}</span><span>${pct(p.so)}</span></div>` : ""}`);
    hit.onmouseleave = hideTip;
  });

  // KPIs vs plan
  const cur = evaluate(rs, adj), base = evaluate(rs, 0);
  const d = (a, b, goodUp, fmt) => adj === 0 ? "" : `<div class="delta ${(a - b >= 0) === goodUp ? "up" : "down"}">${a - b >= 0 ? "+" : "−"}${fmt(Math.abs(a - b))} ${T.vsPlan}</div>`;
  $("kpis").innerHTML = [
    [nf.format(cur.q), T.k[0], d(cur.q, base.q, true, nf.format).replace(/ (up|down)"/, ' "'), false],
    [nf.format(cur.left), T.k[1], d(cur.left, base.left, false, nf.format), false],
    [nf.format(cur.so), T.k[2], d(cur.so, base.so, false, nf.format), false],
    [eur(cur.profit), T.k[3], d(cur.profit, base.profit, true, eur), true],
  ].map(([v, l, dl, hl]) => `<div class="kpi${hl ? " hl" : ""}"><b>${v}</b><span>${l}</span>${dl}</div>`).join("");
  $("adjLabel").textContent = (adj > 0 ? "+" : adj < 0 ? "−" : "±") + Math.abs(adj) + "%";
  drawCurve(rs);
}
// profit curve over the adjustment range (cached per selection)
const cache = {};
function drawCurve(rs) {
  const key = shop + "|" + sku;
  if (!cache[key]) cache[key] = Array.from({ length: 13 }, (_, i) => { const a = -30 + i * 5; return [a, evaluate(rs, a).profit]; });
  const pts = cache[key], svg = $("curve"); svg.innerHTML = "";
  const W = 268, H = 120, L = 6, R = 6, Tp = 12, B = 22;
  const lo = Math.min(...pts.map((p) => p[1])), hi = Math.max(...pts.map((p) => p[1]));
  const x = (a) => L + (a + 30) / 60 * (W - L - R), y = (v) => Tp + (H - Tp - B) * (1 - (v - lo) / ((hi - lo) || 1));
  el("line", { x1: x(0), x2: x(0), y1: Tp - 4, y2: H - B, stroke: "var(--line)", "stroke-dasharray": "3 3" }, svg);
  el("text", { x: x(0), y: H - 6, "font-size": 10.5, fill: "var(--ink-3)", "text-anchor": "middle" }, svg).textContent = T.plan;
  el("text", { x: L, y: H - 6, "font-size": 10.5, fill: "var(--ink-3)" }, svg).textContent = "−30%";
  el("text", { x: W - R, y: H - 6, "font-size": 10.5, fill: "var(--ink-3)", "text-anchor": "end" }, svg).textContent = "+30%";
  el("polyline", { points: pts.map((p) => `${x(p[0])},${y(p[1])}`).join(" "), fill: "none", stroke: "var(--crust)", "stroke-width": 2 }, svg);
  const cur = evaluate(rs, adj).profit;
  el("circle", { cx: x(adj), cy: y(cur), r: 5.5, fill: "var(--butter)", stroke: "var(--surface)", "stroke-width": 2 }, svg);
  pts.forEach(([a, v]) => { const h = el("rect", { x: x(a) - 10, y: 0, width: 20, height: H, fill: "transparent" }, svg); h.onmousemove = (e) => showTip(e, `<b>${a > 0 ? "+" : a < 0 ? "−" : "±"}${Math.abs(a)}%</b><div class="r"><span>${T.k[3]}</span><span>${eur(v)}</span></div>`); h.onmouseleave = hideTip; });
}
render();
</script>
