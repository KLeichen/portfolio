<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harborview maintenance triage</title>
<meta name="description" content="Caso completo: limpieza de datos, NLP paso a paso, detección de emergencias y análisis de proveedores para una administradora de edificios (escenario simulado).">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hv.css">
<style>
  body { font-size: 16px; }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 0 20px; }
  .prose { max-width: 720px; }
  nav.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); }
  nav.top .wrap { display: flex; align-items: center; gap: 14px; height: 52px; }
  nav.top .home { font: 600 13px var(--mono); text-decoration: none; color: var(--ink); white-space: nowrap; }
  nav.top .tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; }
  nav.top .tabs::-webkit-scrollbar { display: none; }
  nav.top .tabs a { font-size: 13px; text-decoration: none; color: var(--ink-2); padding: 6px 9px; border-radius: 6px; white-space: nowrap; }
  nav.top .tabs a.on { background: var(--ink); color: var(--paper); }
  .hero { padding: 54px 0 34px; border-bottom: 2px solid var(--ink); }
  .kicker { font: 600 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .hero h1 { font: 700 clamp(32px, 5.2vw, 54px)/1.03 var(--cond); letter-spacing: -.02em; margin: 14px 0 16px; max-width: 900px; }
  .hero .lede { font-size: 19px; color: var(--ink-2); max-width: 760px; margin: 0; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 30px; }
  .kpi { padding: 14px 16px 14px 26px; }
  .kpi b { display: block; font: 700 32px/1.05 var(--cond); }
  .kpi span { font-size: 13.5px; color: var(--ink-2); display: block; margin-top: 4px; }
  .note { font-size: 13px; color: var(--muted); font-style: italic; margin-top: 16px; }
  section { padding: 56px 0 8px; scroll-margin-top: 56px; }
  .sh { display: flex; gap: 14px; align-items: baseline; border-top: 1px solid var(--rule); padding-top: 14px; margin-bottom: 8px; }
  .sh .n { font: 600 13px var(--mono); color: var(--em); }
  h2 { font: 700 clamp(26px, 3.4vw, 34px)/1.1 var(--cond); margin: 0; letter-spacing: -.01em; }
  h3 { font: 600 19px/1.25 var(--sans); margin: 34px 0 8px; }
  h3 .step { font: 600 12px var(--mono); color: var(--muted); margin-right: 8px; letter-spacing: .06em; }
  p { margin: 10px 0; }
  .prose p, .prose li { color: #2c3743; }
  .fig { margin: 18px 0 8px; padding: 16px 16px 12px; overflow-x: auto; }
  .fig .cap { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .fig h4 { margin: 0 0 10px; font: 600 14px var(--sans); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .row2 > *, .row3 > *, .errs > * { min-width: 0; }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .callout { border-left: 3px solid var(--em); background: var(--card); padding: 12px 16px; border-radius: 0 8px 8px 0; margin: 16px 0; }
  .callout.blue { border-color: var(--blue); }
  .quote { font: italic 18px/1.5 var(--sans); color: var(--ink-2); border-left: 3px solid var(--ink); padding: 4px 0 4px 16px; margin: 18px 0; max-width: 760px; }
  .quote cite { display: block; font: 500 13px var(--mono); font-style: normal; color: var(--muted); margin-top: 6px; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  th { font: 600 11.5px var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  td.num, th.num { text-align: right; font-family: var(--mono); }
  .tbl { overflow-x: auto; }
  code, .code { font: 13px var(--mono); background: var(--paper-2); padding: 1px 5px; border-radius: 4px; }
  pre.code { display: block; padding: 10px 12px; overflow-x: auto; white-space: pre-wrap; }
  .play { position: sticky; top: 52px; z-index: 10; background: var(--paper); padding: 12px 0 10px; border-bottom: 1px dashed var(--rule); margin-top: 16px; }
  .play label { font: 600 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .play .in { display: flex; gap: 8px; margin-top: 6px; }
  .play input { flex: 1; padding: 10px 12px; border: 1.5px solid var(--ink); border-radius: 8px; background: var(--card); font: 15px var(--mono); min-width: 0; }
  .play .ex { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
  .play .ex button { border: 1px dashed var(--rule); background: transparent; border-radius: 999px; padding: 2px 9px; font-size: 12px; cursor: pointer; color: var(--ink-2); }
  .tokens { display: flex; flex-wrap: wrap; gap: 6px; font: 13.5px var(--mono); }
  .tokens span { padding: 3px 8px; border-radius: 5px; background: var(--card); border: 1px solid var(--rule); }
  .tokens span.out { opacity: .45; text-decoration: line-through; }
  .tokens span.bi { border-style: dashed; }
  .tokens span.hit { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 9%, var(--card)); }
  .tokens span.miss { border-color: var(--rule); color: var(--muted); }
  input.cmp, #nin { font: 14px var(--mono); padding: 7px 10px; border: 1px solid var(--ink-2); border-radius: 6px; background: #fff; color: var(--ink); width: 170px; }
  #nin { width: 100%; }
  .strip { width: 100%; height: 34px; display: block; border: 1px solid var(--rule); border-radius: 6px; background: var(--card); }
  .formula { font: 15px var(--mono); background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 14px; margin: 12px 0; overflow-x: auto; }
  .w-bar { height: 8px; background: var(--blue); border-radius: 4px; display: inline-block; vertical-align: middle; }
  .seg-wrap { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 10px 0; font-size: 13px; color: var(--muted); }
  input[type=range] { accent-color: var(--ink); width: 240px; max-width: 100%; }
  .stat-row { display: flex; gap: 22px; flex-wrap: wrap; margin: 8px 0; }
  .stat-row div { font-size: 13px; color: var(--muted); }
  .stat-row b { display: block; font: 700 24px var(--cond); color: var(--ink); }
  .errs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .errs .card { padding: 12px 14px 12px 26px; }
  .errs b.n { font: 700 26px var(--cond); }
  .errs .ex { font: 12.5px/1.5 var(--mono); color: var(--ink-2); margin-top: 6px; }
  .recs { counter-reset: r; list-style: none; padding: 0; display: grid; gap: 10px; }
  .recs li { counter-increment: r; padding: 14px 16px 14px 56px; position: relative; }
  .recs li::before { content: counter(r); position: absolute; left: 16px; top: 13px; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--paper); font: 600 13px/26px var(--mono); text-align: center; }
  .recs b { display: block; margin-bottom: 2px; }
  .flow { overflow-x: auto; }
  .desk-frame { width: 100%; height: 960px; border: 1px solid var(--rule); border-radius: 12px; background: var(--paper); }
  footer { margin: 70px 0 40px; padding-top: 18px; border-top: 2px solid var(--ink); font-size: 13.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin-bottom: 8px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }
  @media (max-width: 820px) {
    .kpis { grid-template-columns: 1fr 1fr; } .row2, .row3, .errs { grid-template-columns: 1fr; }
    .desk-frame { height: 1500px; } nav.top .home span { display: none; }
  }
</style>
</head>
<body>
<nav class="top"><div class="wrap">
  <a class="home" id="home" href="/">← <span>Kevin Leichen</span></a>
  <div class="tabs" id="tabs"></div>
  <div class="seg" role="group" aria-label="Language"><button data-lang="es">ES</button><button data-lang="en">EN</button></div>
</div></nav>
<main id="app" class="wrap"></main>
<script src="common.js"></script>
<script src="triage.js"></script>
<script src="case.js"></script>
</body>
</html>
