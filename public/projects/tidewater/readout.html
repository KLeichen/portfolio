<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidewater · A/B test readout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --paper: #f3f6f5; --surface: #fcfdfc; --ink: #10242b; --ink-2: #46585d; --muted: #6f7e81;
  --line: #dbe2e1; --axis: #b9c4c3; --kelp: #1d6b5f; --kelp-soft: #dcebe7;
  --old: #2a78d6; --new: #eb6834; --old-soft: rgba(42,120,214,.12); --new-soft: rgba(235,104,52,.14);
  --bad: #b3261e; --good: #1d6b5f; --band: rgba(179,38,30,.08);
  --display: "Young Serif", Georgia, serif; --body: "Public Sans", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 14px/1.45 var(--body); }
.wrap { padding: 16px 20px 20px; max-width: 1040px; margin: 0 auto; }
header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.eyebrow { font: 600 11px/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--kelp); }
h1 { font: 400 24px/1.2 var(--display); margin: 4px 0 0; }
h2 { font: 400 19px/1.25 var(--display); margin: 0 0 4px; }
h3 { font: 600 13px/1.3 var(--body); margin: 0 0 6px; color: var(--ink); }
p { margin: 0 0 6px; color: var(--ink-2); }
.note { font-size: 12.5px; color: var(--muted); }
.tabs { display: flex; gap: 4px; margin: 12px 0 14px; flex-wrap: wrap; }
.tabs button, .seg button { font: 600 13px var(--body); border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); padding: 7px 12px; border-radius: 999px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.seg { display: inline-flex; gap: 0; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; border-radius: 0; padding: 6px 11px; font-size: 12.5px; }
.seg button[aria-pressed="true"] { background: var(--kelp-soft); color: var(--kelp); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
.grid { display: grid; gap: 12px; }
.g3 { grid-template-columns: repeat(3, 1fr); }
.gw { grid-template-columns: 1.65fr 1fr; }
.g2 { grid-template-columns: 1.15fr 1fr; }
.lede { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.lede > div:first-child { max-width: 640px; }
.kpi .l { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
.kpi .v { display: block; font: 400 24px/1.2 var(--display); margin: 4px 0 2px; }
.kpi .s { font-size: 12.5px; color: var(--ink-2); }
.up { color: var(--kelp); } .down { color: var(--bad); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
svg text { font: 11px var(--body); fill: var(--muted); }
svg text.lab { fill: var(--ink-2); font-weight: 600; }
.grid line, line.gl { stroke: var(--line); }
line.axis { stroke: var(--axis); }
.hit { fill: transparent; cursor: crosshair; }
.receipts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.receipt { font: 12px/1.5 var(--mono); border: 1px dashed var(--axis); border-radius: 8px; padding: 10px; background: var(--paper); }
.receipt .t { font-weight: 600; margin-bottom: 4px; }
.receipt .r { display: flex; justify-content: space-between; }
.receipt .tot { border-top: 1px dashed var(--axis); margin-top: 4px; padding-top: 4px; font-weight: 600; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
.calc label { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-top: 10px; }
.calc input[type=range] { width: 100%; accent-color: var(--kelp); }
.presets { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.presets button { font: 600 12px var(--body); border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 6px 9px; cursor: pointer; color: var(--ink-2); }
.presets button:hover { border-color: var(--kelp); color: var(--kelp); }
.out { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
.out .box { background: var(--paper); border-radius: 10px; padding: 10px 12px; }
.out .big { font: 400 22px/1.2 var(--display); }
.num { font-family: var(--mono); }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: right; padding: 5px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 600; }
#tip { position: fixed; pointer-events: none; opacity: 0; background: var(--ink); color: var(--paper); padding: 8px 10px; border-radius: 8px; font-size: 12px; z-index: 10; min-width: 170px; transition: opacity .1s; }
#tip .r { display: flex; justify-content: space-between; gap: 14px; }
#tip b { display: block; margin-bottom: 3px; }
.foot { margin-top: 12px; font-size: 11.5px; color: var(--muted); font-style: italic; }
@media (max-width: 760px) {
  .g3, .gw, .g2 { grid-template-columns: 1fr; }
  .wrap { padding: 12px 16px 16px; }
  h1 { font-size: 20px; }
  .receipts, .out { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <div class="eyebrow" data-t="eyebrow"></div>
    <h1 data-t="title"></h1>
  </div>
  <div class="legend"><span><i style="background:var(--old)"></i><span data-t="old"></span></span><span><i style="background:var(--new)"></i><span data-t="new"></span></span></div>
</header>
<nav class="tabs" role="tablist">
  <button role="tab" data-tab="result" aria-selected="true" data-t="tab1"></button>
  <button role="tab" data-tab="fair" aria-selected="false" data-t="tab2"></button>
  <button role="tab" data-tab="channels" aria-selected="false" data-t="tab3"></button>
  <button role="tab" data-tab="next" aria-selected="false" data-t="tab4"></button>
</nav>

<section id="result">
  <div class="grid g3" style="margin-bottom:12px">
    <div class="panel kpi"><span class="l" data-t="k1"></span><span class="v up" id="k1"></span><span class="s" id="k1s"></span></div>
    <div class="panel kpi"><span class="l" data-t="k2"></span><span class="v" id="k2"></span><span class="s" id="k2s"></span></div>
    <div class="panel kpi"><span class="l" data-t="k3"></span><span class="v down" id="k3"></span><span class="s" id="k3s"></span></div>
  </div>
  <div class="grid gw">
    <div class="panel">
      <h3 data-t="cumTitle"></h3>
      <svg class="chart" id="c-cum" viewBox="0 0 600 265" role="img"></svg>
      <p class="note" data-t="cumNote"></p>
    </div>
    <div class="panel">
      <h3 data-t="rcTitle"></h3>
      <div class="receipts"><div class="receipt" id="rc-old"></div><div class="receipt" id="rc-new"></div></div>
      <h3 style="margin-top:12px" data-t="survTitle"></h3>
      <svg class="chart" id="c-surv" viewBox="0 0 340 120" role="img"></svg>
    </div>
  </div>
</section>

<section id="fair" hidden>
  <div class="lede">
    <div><h2 data-t="fairH"></h2><p data-t="fairP"></p></div>
    <div class="seg" role="group"><button data-fix="before" aria-pressed="true" data-t="raw"></button><button data-fix="after" aria-pressed="false" data-t="fixed"></button></div>
  </div>
  <div class="grid gw">
    <div class="panel">
      <h3 data-t="andTitle"></h3>
      <svg class="chart" id="c-and" viewBox="0 0 600 265" role="img"></svg>
      <p class="note" id="and-note"></p>
    </div>
    <div class="panel">
      <h3 data-t="splitTitle"></h3>
      <svg class="chart" id="c-split" viewBox="0 0 340 200" role="img"></svg>
      <p class="note" id="split-note"></p>
    </div>
  </div>
</section>

<section id="channels" hidden>
  <div class="lede">
    <div><h2 data-t="chH"></h2><p data-t="chP"></p></div>
    <div class="seg" role="group"><button data-m="conv" aria-pressed="true" data-t="mConv"></button><button data-m="ret" aria-pressed="false" data-t="mRet"></button><button data-m="cpv" aria-pressed="false" data-t="mCpv"></button></div>
  </div>
  <div class="grid g2">
    <div class="panel">
      <h3 id="ch-title"></h3>
      <svg class="chart" id="c-ch" viewBox="0 0 600 260" role="img"></svg>
    </div>
    <div class="panel" style="overflow-x:auto">
      <h3 data-t="tblTitle"></h3>
      <table><thead><tr><th data-t="thSrc"></th><th data-t="thSign"></th><th data-t="thRet"></th><th data-t="thCpv"></th></tr></thead><tbody id="t-ch"></tbody></table>
      <p class="note" style="margin-top:8px" id="het-note"></p>
    </div>
  </div>
</section>

<section id="next" hidden>
  <div class="lede"><div><h2 data-t="nxH"></h2><p data-t="nxP"></p></div></div>
  <div class="grid gw">
    <div class="panel">
      <h3 data-t="curveTitle"></h3>
      <svg class="chart" id="c-curve" viewBox="0 0 600 300" role="img"></svg>
      <p class="note" data-t="curveNote"></p>
    </div>
    <div class="panel calc">
      <h3 data-t="calcTitle"></h3>
      <div class="presets"><button data-p="tested" data-t="pTested"></button><button data-p="a" data-t="pA"></button><button data-p="none" data-t="pNone"></button></div>
      <label><span data-t="lLift"></span><span class="num" id="v-lift"></span></label>
      <input type="range" id="lift" min="0" max="40" step="1" value="10">
      <label><span data-t="lDisc"></span><span class="num" id="v-disc"></span></label>
      <input type="range" id="disc" min="0" max="40" step="1" value="20">
      <label><span data-t="lStay"></span></label>
      <div class="seg" role="group" style="margin-top:4px"><button data-stay="old" aria-pressed="true" data-t="stayOld"></button><button data-stay="new" aria-pressed="false" data-t="stayNew"></button></div>
      <div class="out">
        <div class="box"><div class="note" data-t="oCpv"></div><div class="big" id="o-cpv"></div><div class="note" id="o-cpv-s"></div></div>
        <div class="box"><div class="note" data-t="oYear"></div><div class="big" id="o-year"></div><div class="note" data-t="oYearS"></div></div>
      </div>
      <p class="note" data-t="calcNote"></p>
    </div>
  </div>
</section>

<p class="foot" data-t="foot"></p>
</div>
<div id="tip" role="tooltip"></div>

    h.addEventListener('pointermove', e => showTip(e, `<b>${T.src[s.source]}</b>` + row(T.visitors, nf(s.visitors)) + row(T.signups, `${nf(s.signups_old)} / ${nf(s.signups_new)}`) +
      row(T.thSign, T.cmp(pct(s.conv_old), pct(s.conv_new))) + row(T.thRet, T.cmp(pct(s.ret_old, 0), pct(s.ret_new, 0))) + row(T.thCpv, T.cmp(usd(s.cpv_old), usd(s.cpv_new))) +
      row(T.range, money ? `${sUsd(lo)} … ${sUsd(hi)}` : `${sPts(lo)} … ${sPts(hi)}`)));
    h.addEventListener('pointerleave', hideTip);
  });
}
$('#t-ch').innerHTML = BS.map(s => `<tr><td>${T.src[s.source]}</td><td class="num">${T.cmp(pct(s.conv_old), pct(s.conv_new))}</td><td class="num">${T.cmp(pct(s.ret_old, 0), pct(s.ret_new, 0))}</td><td class="num">${T.cmp(usd(s.cpv_old), usd(s.cpv_new))}</td></tr>`).join('');
$('#het-note').textContent = T.het;
$$('[data-m]').forEach(b => b.addEventListener('click', () => { metric = b.dataset.m; $$('[data-m]').forEach(o => o.setAttribute('aria-pressed', o === b)); drawCh(); }));

/* ---------- NEXT TEST ---------- */
const V0 = { old: PS.control.contribution + PS.control.discount, new: PS.new_flow.contribution + PS.new_flow.discount };
const base = PV.contribution.control;
let stay = 'old';
const cpvOf = (lift, disc, st) => C.control * (1 + lift) * (V0[st] - disc);
function drawCalc() {
  const lift = +$('#lift').value / 100, disc = +$('#disc').value;
  $('#v-lift').textContent = '+' + nf(lift * 100) + '%';
  $('#v-disc').textContent = usd(disc, 0);
  const v = cpvOf(lift, disc, stay), d = v - base;
  $('#o-cpv').textContent = usd(v);
  $('#o-cpv-s').textContent = `${sUsd(d)} vs ${usd(base)}`;
  const y = $('#o-year'); y.textContent = bigUsd(d * VIS); y.className = 'big ' + (d >= 0 ? 'up' : 'down');
  const svg = $('#c-curve'); clear(svg);
  const W = 600, H = 300, m = { l: 58, r: 20, t: 12, b: 30 };
  const xs = Array.from({ length: 41 }, (_, i) => i / 100);
  const vals = xs.map(l => (cpvOf(l, disc, stay) - base) * VIS);
  const lo = Math.min(-1.5e6, ...vals), hi = Math.max(1.5e6, ...vals);
  const yT = []; const st = hi - lo > 4e6 ? 1e6 : 5e5; for (let t = Math.floor(lo / st) * st; t < hi + st; t += st) yT.push(t);
  const x = lin(0, 0.4, m.l, W - m.r), yy = lin(yT[0], yT[yT.length - 1], H - m.b, m.t);
  el('rect', { x: m.l, y: yy(yT[yT.length - 1]), width: W - m.l - m.r, height: yy(0) - yy(yT[yT.length - 1]), fill: 'rgba(29,107,95,.06)' }, svg);
  yGrid(svg, yy, yT, m.l, W - m.r, t => bigUsd(t).replace('+$0k', '$0').replace('−$0k', '$0'));
  el('line', { x1: m.l, x2: W - m.r, y1: yy(0), y2: yy(0), stroke: css('--old'), 'stroke-width': 2, 'stroke-dasharray': '6 4' }, svg);
  txt(svg, W - m.r - 4, yy(0) - 6, T.old.split(':')[0], { 'text-anchor': 'end', class: 'lab' });
  [0, .1, .2, .3, .4].forEach(t => txt(svg, x(t), H - m.b + 16, '+' + nf(t * 100) + '%', { 'text-anchor': 'middle' }));
  el('path', { d: xs.map((l, i) => `${i ? 'L' : 'M'}${x(l)},${yy(vals[i])}`).join(''), fill: 'none', stroke: css('--kelp'), 'stroke-width': 2 }, svg);
  // tested point
  const tv = (PV.contribution.new - base) * VIS;
  el('circle', { cx: x(C.lift), cy: yy(tv), r: 5, fill: css('--new'), stroke: css('--surface'), 'stroke-width': 2 }, svg);
  txt(svg, x(C.lift) + 9, yy(tv) + 4, T.testedDot, { class: 'lab' });
  el('circle', { cx: x(lift), cy: yy(d * VIS), r: 7, fill: css('--kelp'), stroke: css('--surface'), 'stroke-width': 2.5 }, svg);
  const cross = el('line', { y1: m.t, y2: H - m.b, stroke: css('--axis'), 'stroke-dasharray': '3 3', opacity: 0 }, svg);
  const hit = el('rect', { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, class: 'hit' }, svg);
  hit.addEventListener('pointermove', e => {
    const p = svgPt(svg, e); const i = Math.max(0, Math.min(40, Math.round((p.x - m.l) / (x(.01) - x(0)))));
    cross.setAttribute('x1', x(xs[i])); cross.setAttribute('x2', x(xs[i])); cross.setAttribute('opacity', 1);
    showTip(e, `<b>${T.lLift}: +${i}%</b>` + row(T.oCpv, usd(cpvOf(xs[i], disc, stay))) + row(T.oYear, bigUsd(vals[i])));
  });
  hit.addEventListener('pointerleave', () => { hideTip(); cross.setAttribute('opacity', 0); });
}
['#lift', '#disc'].forEach(s => $(s).addEventListener('input', drawCalc));
function setStay(s) { stay = s; $$('[data-stay]').forEach(o => o.setAttribute('aria-pressed', o.dataset.stay === s)); }
$$('[data-stay]').forEach(b => b.addEventListener('click', () => { setStay(b.dataset.stay); drawCalc(); }));
const presets = { tested: [Math.round(C.lift * 100), Math.round(PS.new_flow.discount), 'new'], a: [10, 20, 'old'], none: [0, 0, 'old'] };
$$('[data-p]').forEach(b => b.addEventListener('click', () => { const [l, d, s] = presets[b.dataset.p]; $('#lift').value = l; $('#disc').value = d; setStay(s); drawCalc(); }));

/* ---------- tabs ---------- */
const draws = { result: () => { drawCum(); drawSurv(); }, fair: () => { drawAndroid(); drawSplit(); }, channels: drawCh, next: drawCalc };
function show(id) {
  $$('[role=tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === id));
  ['result', 'fair', 'channels', 'next'].forEach(s => $('#' + s).hidden = s !== id);
  draws[id]();
}
$$('[role=tab]').forEach(b => b.addEventListener('click', () => show(b.dataset.tab)));
const start = new URLSearchParams(location.search).get('tab');
show(draws[start] ? start : 'result');
</script>
